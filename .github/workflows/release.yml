name: Push to Itch

on:
  release:
    types: [published]  # Triggers when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Debug GitHub API response
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/itchio/butler/releases/latest > response.json
          cat response.json

      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Variables
          GAME=chem-helper
          USER=chemhelper
          CHANNEL=html
          PACKAGE_DIR=Builds/
          VERSION=${{ github.event.release.tag_name }}

          echo "Pushing $PACKAGE_DIR to $USER/$GAME:$CHANNEL with version $VERSION"
          butler push "$PACKAGE_DIR" "$USER/$GAME:$CHANNEL" --userversion "$VERSION"
