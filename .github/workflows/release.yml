name: Push to Itch

on:
  release:
    types: [published]  # Triggers when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Download latest Butler binary using GitHub API
        env:
          GITHUB_API_URL: https://api.github.com/repos/itchio/butler/releases/latest
        run: |
          echo "Fetching latest release info..."
          DOWNLOAD_URL=$(curl -s $GITHUB_API_URL \
            | jq -r '.assets[] | select(.name == "butler-linux-amd64.gz") | .url')
      
          echo "Downloading Butler binary from $DOWNLOAD_URL"
      
          # Download asset with header to accept binary content
          curl -L -H "Accept: application/octet-stream" -o butler.gz "$DOWNLOAD_URL"
      
          # Unzip, make executable, move to PATH
          gunzip butler.gz
          chmod +x butler
          sudo mv butler /usr/local/bin/
      
          # Verify
          butler --version

      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Variables
          GAME=chem-helper
          USER=chemhelper
          CHANNEL=html
          PACKAGE_DIR=Builds/
          VERSION=${{ github.event.release.tag_name }}

          echo "Pushing $PACKAGE_DIR to $USER/$GAME:$CHANNEL with version $VERSION"
          butler push "$PACKAGE_DIR" "$USER/$GAME:$CHANNEL" --userversion "$VERSION"
