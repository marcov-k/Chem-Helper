name: Push to Itch

on:
  release:
    types: [published]  # Triggers when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install Butler
        run: |
          curl -L -o butler.tar.gz https://broth.itch.ovh/butler/linux-amd64/latest/archive/default
          mkdir -p butler
          tar -xzf butler.tar.gz -C butler
          sudo mv butler/butler /usr/local/bin/
          butler --version

      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Variables
          GAME=chem-helper
          USER=chemhelper
          CHANNEL=html
          PACKAGE_DIR=Builds/
          VERSION=${{ github.event.release.tag_name }}

          echo "Pushing $PACKAGE_DIR to $USER/$GAME:$CHANNEL with version $VERSION"
          butler push "$PACKAGE_DIR" "$USER/$GAME:$CHANNEL" --userversion "$VERSION"
